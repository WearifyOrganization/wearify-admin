name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow's own GITHUB_TOKEN only needs to read this repository. Access to
# the private backend (for the @wearify/shared dependency) never uses this
# token; it uses the separately scoped GitHub App token created in the job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @wearify/shared is a git dependency on the private
      # WearifyOrganization/wearify-backend repository (tag in package.json,
      # commit in pnpm-lock.yaml). `pnpm install` clones it over HTTPS with the
      # system git, and the default GITHUB_TOKEN is scoped to this repository
      # only. The "Wearify CI" GitHub App is installed on wearify-backend alone;
      # the token minted here is limited to that repository with contents:read,
      # expires after an hour and is revoked when the job ends.
      - name: Create Wearify CI token
        id: wearify-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WEARIFY_CI_APP_ID }}
          private-key: ${{ secrets.WEARIFY_CI_APP_PRIVATE_KEY }}
          owner: WearifyOrganization
          repositories: wearify-backend
          permission-contents: read

      # Route HTTPS clones of github.com through the App token so pnpm's git
      # clone of the backend authenticates. The token is read from the
      # environment and written only to the runner's git config.
      - name: Configure Git for private backend dependency
        run: |
          git config --global url."https://x-access-token:${WEARIFY_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          WEARIFY_APP_TOKEN: ${{ steps.wearify-app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm test
      - run: pnpm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
