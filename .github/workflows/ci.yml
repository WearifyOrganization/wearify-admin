name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # @wearify/shared is a git dependency on the private
      # WearifyOrganization/wearify-shared repository (pinned tag in
      # package.json, commit in pnpm-lock.yaml). `pnpm install` clones it over
      # HTTPS, so the runner needs read access to that repository; the default
      # GITHUB_TOKEN is scoped to this repository only and does not grant it.
      # That access is configured at the organisation level, not in this file.

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm test
      - run: pnpm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
